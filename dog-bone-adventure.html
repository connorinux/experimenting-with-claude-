<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog &amp; Bone Adventure</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Georgia', serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ═══════════════ SKY & GROUND ═══════════════ */
  #sky {
    position: fixed; inset: 0;
    transition: background 3s ease;
    background: linear-gradient(180deg, #5a5e6b 0%, #7a7e8b 30%, #8e929d 55%, #9a9ea8 100%);
  }
  #sky.brightening {
    background: linear-gradient(180deg, #6a8aad 0%, #8aaac8 30%, #aac4d8 55%, #c0d8e8 100%);
  }
  #sky.sunny {
    background: linear-gradient(180deg, #4a9ede 0%, #6ab4ee 30%, #8ccaf5 55%, #b0ddf8 100%);
  }

  /* Sun */
  #sun {
    position: fixed;
    top: 6%;
    right: 15%;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff8c4 0%, #ffe066 40%, rgba(255,200,50,0) 70%);
    box-shadow: 0 0 60px 20px rgba(255,220,80,0.2);
    opacity: 0;
    transition: opacity 3s ease, box-shadow 3s ease;
    pointer-events: none;
    z-index: 1;
  }
  #sun.emerging {
    opacity: 0.5;
    box-shadow: 0 0 80px 30px rgba(255,220,80,0.3);
  }
  #sun.full {
    opacity: 1;
    box-shadow: 0 0 120px 50px rgba(255,220,80,0.4);
  }

  /* Clouds */
  .cloud {
    position: fixed;
    border-radius: 50%;
    background: rgba(160,165,175,0.7);
    pointer-events: none;
    z-index: 2;
    transition: opacity 3s ease, transform 3s ease;
  }
  .cloud-1 { top: 5%; left: 10%; width: 200px; height: 70px; }
  .cloud-2 { top: 12%; left: 40%; width: 250px; height: 80px; }
  .cloud-3 { top: 3%; right: 10%; width: 180px; height: 60px; }
  .cloud-4 { top: 18%; left: 65%; width: 160px; height: 55px; }
  .cloud-5 { top: 8%; left: 25%; width: 140px; height: 50px; }

  .cloud.parting-1 { opacity: 0.4; transform: translateX(-40px); }
  .cloud.parting-2 { opacity: 0.4; transform: translateX(40px) translateY(-10px); }
  .cloud.gone-1 { opacity: 0; transform: translateX(-100px) translateY(-30px); }
  .cloud.gone-2 { opacity: 0; transform: translateX(100px) translateY(-30px); }

  /* Ground */
  #ground {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 35%;
    background: linear-gradient(180deg, #5a6b45 0%, #4d5e3a 50%, #3f5030 100%);
    transition: background 3s ease;
    z-index: 3;
  }
  #ground.brightening {
    background: linear-gradient(180deg, #6a8050 0%, #5d7345 50%, #4f6538 100%);
  }
  #ground.sunny {
    background: linear-gradient(180deg, #7a9b58 0%, #6a8a48 50%, #5a7a3a 100%);
  }

  /* Grass tufts */
  .grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ═══════════════ PUDDLE ═══════════════ */
  #puddle {
    position: fixed;
    bottom: 22%;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 40px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(90,120,150,0.7) 0%, rgba(70,100,130,0.5) 60%, rgba(70,100,130,0) 100%);
    z-index: 5;
    pointer-events: none;
    transition: background 3s ease;
  }
  #puddle.bright {
    background: radial-gradient(ellipse, rgba(100,160,210,0.6) 0%, rgba(80,140,190,0.4) 60%, rgba(80,140,190,0) 100%);
  }

  /* Puddle ripple */
  #puddle::after {
    content: '';
    position: absolute;
    inset: 10% 20%;
    border-radius: 50%;
    border: 1px solid rgba(180,200,220,0.3);
    animation: puddleRipple 3s ease-in-out infinite;
  }
  @keyframes puddleRipple {
    0%, 100% { transform: scale(0.8); opacity: 0.3; }
    50% { transform: scale(1.1); opacity: 0.6; }
  }

  /* ═══════════════ DOG (SVG) ═══════════════ */
  #dog-container {
    position: fixed;
    bottom: 24%;
    left: 18%;
    width: 180px;
    height: 180px;
    z-index: 10;
    transition: left 0.05s linear, bottom 0.05s linear;
  }

  /* Scared shaking */
  #dog-container.scared {
    animation: tremble 0.3s ease-in-out infinite;
  }
  @keyframes tremble {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px) rotate(-0.5deg); }
    75% { transform: translateX(2px) rotate(0.5deg); }
  }

  #dog-container.jumping {
    animation: none;
  }
  #dog-container.landed {
    animation: none;
  }

  /* Tail wag for happy state */
  .tail-wag {
    transform-origin: 85% 55%;
    animation: wagTail 0.3s ease-in-out infinite alternate;
  }
  @keyframes wagTail {
    0% { transform: rotate(-15deg); }
    100% { transform: rotate(25deg); }
  }

  /* ═══════════════ BONE ═══════════════ */
  #bone-container {
    position: fixed;
    bottom: 32%;
    right: 18%;
    width: 80px;
    height: 60px;
    z-index: 10;
    cursor: pointer;
    animation: boneFloat 1.2s ease-in-out infinite;
    transition: opacity 0.5s ease;
  }
  @keyframes boneFloat {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-15px) rotate(5deg); }
  }
  #bone-container:hover {
    filter: drop-shadow(0 0 12px rgba(255,255,220,0.8));
  }
  #bone-container.grabbed {
    animation: none;
    opacity: 0;
    pointer-events: none;
  }

  /* Sparkle around bone */
  .bone-sparkle {
    position: absolute;
    width: 8px; height: 8px;
    background: rgba(255,255,200,0.9);
    border-radius: 50%;
    pointer-events: none;
    animation: sparkle 1.5s ease-in-out infinite;
  }
  .bone-sparkle:nth-child(2) { top: -8px; left: 30%; animation-delay: 0.3s; }
  .bone-sparkle:nth-child(3) { top: 10%; right: -5px; animation-delay: 0.6s; width: 6px; height: 6px; }
  .bone-sparkle:nth-child(4) { bottom: -5px; left: 50%; animation-delay: 0.9s; width: 5px; height: 5px; }
  .bone-sparkle:nth-child(5) { top: 20%; left: -8px; animation-delay: 1.2s; width: 7px; height: 7px; }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* ═══════════════ HEARTS ═══════════════ */
  .heart {
    position: fixed;
    font-size: 24px;
    pointer-events: none;
    opacity: 0;
    z-index: 20;
    color: #ff6b9d;
  }

  /* ═══════════════ BONE IN MOUTH (for happy dog) ═══════════════ */
  #bone-in-mouth {
    position: absolute;
    top: 48%;
    left: 18%;
    width: 50px;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }
  #bone-in-mouth.visible { opacity: 1; }

  /* ═══════════════ FLOWER DETAILS ═══════════════ */
  .flower {
    position: fixed;
    z-index: 4;
    opacity: 0;
    transition: opacity 2s ease;
    pointer-events: none;
  }
  .flower.visible { opacity: 1; }
</style>
</head>
<body>

<!-- Sky -->
<div id="sky"></div>
<div id="sun"></div>
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>
<div class="cloud cloud-4"></div>
<div class="cloud cloud-5"></div>

<!-- Ground -->
<div id="ground">
  <div class="grass"></div>
</div>

<!-- Puddle -->
<div id="puddle"></div>

<!-- Dog -->
<div id="dog-container" class="scared">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="dog-svg">
    <!-- Tail -->
    <g id="dog-tail">
      <path d="M160,95 Q185,70 175,50" stroke="#a07040" stroke-width="8" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Body -->
    <ellipse cx="110" cy="105" rx="55" ry="40" fill="#b8864e"/>
    <ellipse cx="110" cy="100" rx="50" ry="36" fill="#c99b5e"/>
    <!-- Back legs -->
    <rect x="135" y="130" width="16" height="40" rx="8" fill="#a07040"/>
    <rect x="148" y="130" width="16" height="38" rx="8" fill="#b8864e"/>
    <!-- Front legs -->
    <rect x="65" y="128" width="16" height="42" rx="8" fill="#a07040"/>
    <rect x="78" y="128" width="16" height="40" rx="8" fill="#b8864e"/>
    <!-- Paws -->
    <ellipse cx="73" cy="172" rx="12" ry="6" fill="#8a6535"/>
    <ellipse cx="86" cy="170" rx="12" ry="6" fill="#8a6535"/>
    <ellipse cx="143" cy="172" rx="12" ry="6" fill="#8a6535"/>
    <ellipse cx="156" cy="170" rx="12" ry="6" fill="#8a6535"/>
    <!-- Head -->
    <ellipse cx="65" cy="72" rx="38" ry="34" fill="#c99b5e"/>
    <!-- Ears -->
    <ellipse cx="38" cy="48" rx="14" ry="22" fill="#a07040" transform="rotate(-15,38,48)"/>
    <ellipse cx="92" cy="48" rx="14" ry="22" fill="#a07040" transform="rotate(15,92,48)"/>
    <ellipse cx="40" cy="50" rx="10" ry="17" fill="#c99b5e" transform="rotate(-15,40,50)"/>
    <ellipse cx="90" cy="50" rx="10" ry="17" fill="#c99b5e" transform="rotate(15,90,50)"/>
    <!-- Face -->
    <!-- Eyes (scared - wide) -->
    <g id="dog-eyes-scared">
      <ellipse cx="52" cy="68" rx="8" ry="9" fill="white"/>
      <ellipse cx="78" cy="68" rx="8" ry="9" fill="white"/>
      <circle cx="54" cy="69" r="5" fill="#2a1a0a"/>
      <circle cx="80" cy="69" r="5" fill="#2a1a0a"/>
      <circle cx="56" cy="67" r="2" fill="white"/>
      <circle cx="82" cy="67" r="2" fill="white"/>
    </g>
    <!-- Eyes (happy - squinting) -->
    <g id="dog-eyes-happy" style="display:none">
      <path d="M44,67 Q52,60 60,67" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M70,67 Q78,60 86,67" stroke="#2a1a0a" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Nose -->
    <ellipse cx="65" cy="82" rx="7" ry="5" fill="#2a1a0a"/>
    <ellipse cx="65" cy="80" rx="3" ry="1.5" fill="#4a3a2a" opacity="0.4"/>
    <!-- Mouth (scared) -->
    <path id="dog-mouth-scared" d="M58,88 Q65,92 72,88" stroke="#5a3a1a" stroke-width="1.5" fill="none"/>
    <!-- Mouth (happy - open smile) -->
    <path id="dog-mouth-happy" d="M52,86 Q65,100 78,86" stroke="#5a3a1a" stroke-width="2" fill="none" style="display:none"/>
    <path id="dog-tongue" d="M60,93 Q65,103 70,93" fill="#e87080" style="display:none"/>
    <!-- Eyebrows (worried) -->
    <line id="brow-l" x1="44" y1="58" x2="58" y2="56" stroke="#8a6535" stroke-width="2.5" stroke-linecap="round"/>
    <line id="brow-r" x1="72" y1="56" x2="86" y2="58" stroke="#8a6535" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Collar -->
    <path d="M40,95 Q65,108 90,95" stroke="#cc4444" stroke-width="5" fill="none"/>
    <circle cx="65" cy="103" r="4" fill="#ffcc00"/>

    <!-- Bone in mouth placeholder (hidden initially) -->
    <g id="bone-mouth" style="display:none">
      <rect x="30" y="84" width="45" height="10" rx="5" fill="#f5f0e0"/>
      <circle cx="30" cy="89" r="7" fill="#f5f0e0"/>
      <circle cx="75" cy="89" r="7" fill="#f5f0e0"/>
      <circle cx="30" cy="89" r="4" fill="#e8e0cc"/>
      <circle cx="75" cy="89" r="4" fill="#e8e0cc"/>
    </g>
  </svg>
</div>

<!-- Bone (interactive) -->
<div id="bone-container">
  <div class="bone-sparkle"></div>
  <div class="bone-sparkle"></div>
  <div class="bone-sparkle"></div>
  <div class="bone-sparkle"></div>
  <div class="bone-sparkle"></div>
  <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
    <rect x="22" y="20" width="56" height="18" rx="9" fill="#f5f0e0"/>
    <circle cx="22" cy="20" r="11" fill="#f5f0e0"/>
    <circle cx="22" cy="38" r="11" fill="#f5f0e0"/>
    <circle cx="78" cy="20" r="11" fill="#f5f0e0"/>
    <circle cx="78" cy="38" r="11" fill="#f5f0e0"/>
    <!-- shading -->
    <circle cx="22" cy="20" r="7" fill="#e8e0cc" opacity="0.5"/>
    <circle cx="22" cy="38" r="7" fill="#e8e0cc" opacity="0.5"/>
    <circle cx="78" cy="20" r="7" fill="#e8e0cc" opacity="0.5"/>
    <circle cx="78" cy="38" r="7" fill="#e8e0cc" opacity="0.5"/>
    <rect x="26" y="22" width="48" height="14" rx="7" fill="#e8e0cc" opacity="0.3"/>
    <!-- highlight -->
    <rect x="30" y="23" width="20" height="5" rx="2.5" fill="white" opacity="0.4"/>
  </svg>
</div>

<!-- Flowers (appear in sunny scene) -->
<svg class="flower" style="bottom:28%;left:8%;width:30px;height:30px;" viewBox="0 0 30 30">
  <circle cx="15" cy="12" r="5" fill="#ff9eaa"/><circle cx="10" cy="15" r="5" fill="#ff9eaa"/>
  <circle cx="20" cy="15" r="5" fill="#ff9eaa"/><circle cx="15" cy="18" r="5" fill="#ff9eaa"/>
  <circle cx="15" cy="15" r="3" fill="#ffe066"/>
  <line x1="15" y1="20" x2="15" y2="30" stroke="#5a8a3a" stroke-width="2"/>
</svg>
<svg class="flower" style="bottom:26%;left:82%;width:25px;height:25px;" viewBox="0 0 30 30">
  <circle cx="15" cy="12" r="5" fill="#aad4ff"/><circle cx="10" cy="15" r="5" fill="#aad4ff"/>
  <circle cx="20" cy="15" r="5" fill="#aad4ff"/><circle cx="15" cy="18" r="5" fill="#aad4ff"/>
  <circle cx="15" cy="15" r="3" fill="#ffe066"/>
  <line x1="15" y1="20" x2="15" y2="30" stroke="#5a8a3a" stroke-width="2"/>
</svg>
<svg class="flower" style="bottom:30%;right:30%;width:22px;height:22px;" viewBox="0 0 30 30">
  <circle cx="15" cy="12" r="5" fill="#ffcce0"/><circle cx="10" cy="15" r="5" fill="#ffcce0"/>
  <circle cx="20" cy="15" r="5" fill="#ffcce0"/><circle cx="15" cy="18" r="5" fill="#ffcce0"/>
  <circle cx="15" cy="15" r="3" fill="#ffe066"/>
  <line x1="15" y1="20" x2="15" y2="30" stroke="#5a8a3a" stroke-width="2"/>
</svg>

<script>
(function () {
  const sky       = document.getElementById('sky');
  const sun       = document.getElementById('sun');
  const ground    = document.getElementById('ground');
  const puddle    = document.getElementById('puddle');
  const dog       = document.getElementById('dog-container');
  const bone      = document.getElementById('bone-container');
  const clouds    = document.querySelectorAll('.cloud');
  const flowers   = document.querySelectorAll('.flower');

  // Dog face parts
  const eyesScared  = document.getElementById('dog-eyes-scared');
  const eyesHappy   = document.getElementById('dog-eyes-happy');
  const mouthScared = document.getElementById('dog-mouth-scared');
  const mouthHappy  = document.getElementById('dog-mouth-happy');
  const tongue      = document.getElementById('dog-tongue');
  const browL       = document.getElementById('brow-l');
  const browR       = document.getElementById('brow-r');
  const tail        = document.getElementById('dog-tail');
  const boneMouth   = document.getElementById('bone-mouth');

  let scene = 1;

  // ─── Scene 2: Bone clicked → Dog jumps ───
  bone.addEventListener('click', function () {
    if (scene !== 1) return;
    scene = 2;

    // Get bone position as target
    const boneRect = bone.getBoundingClientRect();
    const boneX = boneRect.left - 30;
    const boneBottom = window.innerHeight - boneRect.bottom + boneRect.height / 2;

    // Get dog's starting position
    const dogRect = dog.getBoundingClientRect();
    const startX = dogRect.left;
    const startBottom = window.innerHeight - dogRect.bottom;

    // Remove scared animation, start jump
    dog.classList.remove('scared');
    dog.classList.add('jumping');

    // Animate the jump as a parabolic arc
    const jumpDuration = 900; // ms
    const startTime = performance.now();
    const targetX = boneX;
    const targetBottom = startBottom; // land at same height

    // Peak height of jump
    const jumpPeak = 160;

    function animateJump(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / jumpDuration, 1);

      // Ease: smooth in-out
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

      // X: linear interpolation
      const currentX = startX + (targetX - startX) * ease;

      // Y: parabolic arc (peaks at t=0.5)
      const arcT = t;
      const arcY = -4 * jumpPeak * arcT * (arcT - 1);

      dog.style.left = currentX + 'px';
      dog.style.bottom = (startBottom + arcY) + 'px';

      // Slight rotation during jump
      const rotation = Math.sin(t * Math.PI) * 10;
      dog.style.transform = `rotate(${-rotation}deg)`;

      if (t < 1) {
        requestAnimationFrame(animateJump);
      } else {
        // Landing!
        dog.style.transform = 'rotate(0deg)';
        dog.classList.remove('jumping');
        dog.classList.add('landed');

        // Small bounce
        const bounceStart = performance.now();
        function bounce(now2) {
          const bt = Math.min((now2 - bounceStart) / 200, 1);
          const by = Math.sin(bt * Math.PI) * 8;
          dog.style.bottom = (startBottom + by) + 'px';
          if (bt < 1) requestAnimationFrame(bounce);
          else {
            dog.style.bottom = startBottom + 'px';
            enterScene3();
          }
        }
        requestAnimationFrame(bounce);
      }
    }

    requestAnimationFrame(animateJump);

    // Hide the hovering bone as dog "grabs" it
    setTimeout(() => {
      bone.classList.add('grabbed');
    }, jumpDuration * 0.7);

    // Start environment transition during jump
    sky.classList.add('brightening');
    sun.classList.add('emerging');
    ground.classList.add('brightening');
    clouds.forEach((c, i) => {
      c.classList.add(i % 2 === 0 ? 'parting-1' : 'parting-2');
    });
  });

  // ─── Scene 3: Happy dog with bone ───
  function enterScene3() {
    scene = 3;

    // Swap face to happy
    eyesScared.style.display = 'none';
    eyesHappy.style.display = '';
    mouthScared.style.display = 'none';
    mouthHappy.style.display = '';
    tongue.style.display = '';
    browL.style.display = 'none';
    browR.style.display = 'none';

    // Show bone in mouth
    boneMouth.style.display = '';

    // Start tail wagging
    tail.classList.add('tail-wag');

    // Full sunny sky
    setTimeout(() => {
      sky.classList.remove('brightening');
      sky.classList.add('sunny');
      sun.classList.remove('emerging');
      sun.classList.add('full');
      ground.classList.remove('brightening');
      ground.classList.add('sunny');
      puddle.classList.add('bright');
      clouds.forEach((c, i) => {
        c.classList.remove('parting-1', 'parting-2');
        c.classList.add(i % 2 === 0 ? 'gone-1' : 'gone-2');
      });
    }, 500);

    // Show flowers
    setTimeout(() => {
      flowers.forEach(f => f.classList.add('visible'));
    }, 1500);

    // Spawn hearts
    spawnHearts();
  }

  // ─── Heart spawner ───
  function spawnHearts() {
    const dogRect = dog.getBoundingClientRect();
    const cx = dogRect.left + dogRect.width * 0.35;
    const cy = dogRect.top + dogRect.height * 0.2;
    let heartCount = 0;
    const maxHearts = 40;

    function addHeart() {
      if (heartCount >= maxHearts) return;
      heartCount++;

      const h = document.createElement('div');
      h.className = 'heart';
      h.innerHTML = '&#10084;';

      const size = 16 + Math.random() * 18;
      h.style.fontSize = size + 'px';
      h.style.left = (cx + (Math.random() - 0.5) * 80) + 'px';
      h.style.top = (cy + (Math.random() - 0.5) * 30) + 'px';
      h.style.color = Math.random() > 0.5 ? '#ff6b9d' : '#ff8ab5';

      document.body.appendChild(h);

      const dx = (Math.random() - 0.5) * 60;
      const dy = -60 - Math.random() * 80;
      const dur = 1500 + Math.random() * 1000;

      h.animate([
        { opacity: 0, transform: 'translate(0,0) scale(0.3) rotate(0deg)' },
        { opacity: 1, transform: `translate(${dx * 0.3}px, ${dy * 0.3}px) scale(1) rotate(${(Math.random()-0.5)*30}deg)`, offset: 0.3 },
        { opacity: 0, transform: `translate(${dx}px, ${dy}px) scale(0.6) rotate(${(Math.random()-0.5)*40}deg)` }
      ], { duration: dur, easing: 'ease-out', fill: 'forwards' });

      setTimeout(() => h.remove(), dur + 50);

      // Schedule next heart
      if (heartCount < maxHearts) {
        setTimeout(addHeart, 250 + Math.random() * 350);
      }
    }

    // Start after a short delay
    setTimeout(addHeart, 600);
  }

})();
</script>
</body>
</html>
